services:
  api:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    command: uvicorn runtime.app:app --host 0.0.0.0 --port 8000
    env_file: .env.agent-runtime
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    command: python -m runtime.worker
    env_file: .env.agent-runtime
    environment:
      RUNTIME_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
