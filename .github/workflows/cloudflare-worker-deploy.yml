name: Deploy Cloudflare Lead Capture Worker

on:
  workflow_dispatch:

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_HEALTH_URL: ${{ vars.CLOUDFLARE_WORKER_HEALTH_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      HF_SCORER_URL: ${{ secrets.HF_SCORER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SUPABASE_URL SUPABASE_ANON_KEY HF_SCORER_URL CLOUDFLARE_WORKER_HEALTH_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Sync Supabase and scorer secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_URL" | wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY
          printf '%s' "$HF_SCORER_URL" | wrangler secret put HF_SCORER_URL

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy

      - name: Health check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not construct a workers.dev hostname from the Cloudflare account ID.
          # GitHub's production environment must define the deployed health URL.
          case "$CLOUDFLARE_WORKER_HEALTH_URL" in
            https://*) ;;
            *) echo "::error::CLOUDFLARE_WORKER_HEALTH_URL must use HTTPS"; exit 1;;
          esac
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 --output /dev/null \
            "$CLOUDFLARE_WORKER_HEALTH_URL"
          echo "Cloudflare Worker health endpoint returned HTTP success"
