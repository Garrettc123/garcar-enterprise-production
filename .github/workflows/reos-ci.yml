name: Real Estate Intelligence OS CI
on:
  push:
    paths:
      - 'services/real_estate_intelligence/**'
      - '.github/workflows/reos-ci.yml'
  pull_request:
    paths:
      - 'services/real_estate_intelligence/**'
      - '.github/workflows/reos-ci.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/real_estate_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
