name: API Health Monitor

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    name: Ping cash surface and optional API
    steps:
      - name: Cash storefront must be 200
        run: |
          url="https://garrettc123.github.io/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
          echo "Storefront HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cash storefront down (HTTP $STATUS)"
            exit 1
          fi

      - name: Optional API_URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL secret is not set. Backend is not part of the cash path. Storefront check already passed."
            exit 0
          fi
          MAX_RETRIES=3
          RETRY_DELAY=15
          attempt=1
          while [ $attempt -le $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API_URL/health" || echo "000")
            echo "Attempt $attempt — HTTP Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "::warning::Attempt $attempt — API returned HTTP $STATUS"
            if [ $attempt -lt $MAX_RETRIES ]; then
              sleep $RETRY_DELAY
            fi
            attempt=$((attempt + 1))
          done
          echo "::warning::API_URL is set but did not return 200. Not failing the job; cash storefront is the required surface."
          exit 0
