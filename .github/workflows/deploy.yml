name: Deploy GARCAR Backend

on:
  workflow_dispatch:

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {} 

jobs:
  deploy:
    permissions: {} 
    runs-on: ubuntu-latest
    name: Deploy to Render
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is missing"
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL secret is missing; a deployment cannot be verified"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_URL: ${{ secrets.API_URL }}

      - name: Trigger Render deploy
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK" \
            --fail --silent --show-error
          echo "Deploy triggered successfully"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Wait for deployment
        if: env.skip != 'true'
        run: sleep 30

      - name: Health check
        if: env.skip != 'true'
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL%/}/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "GARCAR API is live at $API_URL"
              curl -s "$API_URL/health"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Render health check failed; deployment remains unverified"
          exit 1
        env:
          API_URL: ${{ secrets.API_URL }}
