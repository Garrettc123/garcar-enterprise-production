name: ADM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Import smoke check
        run: |
          cd backend
          python -c "import main; print('backend/main.py OK')"
