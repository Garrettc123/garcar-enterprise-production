name: Garcar Gateway CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Governance policy and authorization tests
        run: python -m pytest -q tests/test_governance_policy.py tests/test_governance_auth.py
      - name: Import check
        run: python -c "from src.main import app; print('gateway OK')"
