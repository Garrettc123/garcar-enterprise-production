name: Revenue Pain Cycle

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  cycle:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run autonomous revenue pain cycle
        env:
          PYTHONPATH: .
        run: python -m agents.revenue_pain_system.engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: revenue-pain-cycle
          path: |
            agents/revenue_pain_system/LATEST_CYCLE.json
            agents/revenue_pain_system/pain_ledger.json
          if-no-files-found: ignore
