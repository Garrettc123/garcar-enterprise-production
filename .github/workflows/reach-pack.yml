name: REACH pack
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pack
        run: python reach/generate_pack.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reach-pack
          path: reach/pack-*.md
