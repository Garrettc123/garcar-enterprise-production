name: Butler Revenue Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Required cash surface
        id: cash
        run: |
          echo "=== BUTLER REVENUE MONITOR ==="
          echo "Time: $(date -u)"
          FAIL=0
          # The only surface that can take a stranger $47 today.
          url="https://garrettc123.github.io/"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
          echo "REQUIRED $url -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cash storefront is down (HTTP $code)"
            FAIL=1
          fi
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Optional product URLs
        env:
          PRODUCT_URLS: ${{ secrets.PRODUCT_URLS }}
          BUTLER_WEBHOOK_URL: ${{ secrets.BUTLER_WEBHOOK_URL }}
        run: |
          if [ -z "$PRODUCT_URLS" ]; then
            echo "[WARN] PRODUCT_URLS secret not configured — optional checks skipped"
          else
            for url in $PRODUCT_URLS; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              echo "OPTIONAL $url -> HTTP $code"
              if [ "$code" != "200" ]; then
                echo "::warning::$url is DOWN (status $code)"
                if [ -n "$BUTLER_WEBHOOK_URL" ]; then
                  curl -s -X POST "$BUTLER_WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -d "{\"alert\":\"down\",\"url\":\"$url\",\"status\":\"$code\",\"time\":\"$(date -u)\"}" \
                    || echo "[WARN] Alert post failed"
                fi
              fi
            done
          fi

      - name: Known-dead hosts (must not decide job success)
        run: |
          echo "Checking legacy hosts (informational only):"
          for url in \
            "https://frontend-sigma-flame-17.vercel.app" \
            "https://garcar-enterprise-production-production.up.railway.app/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            echo "LEGACY $url -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::Legacy host not live (HTTP $code). Do not treat this as a cash outage."
            fi
          done

      - name: Revenue pulse
        env:
          BUTLER_WEBHOOK_URL: ${{ secrets.BUTLER_WEBHOOK_URL }}
        run: |
          if [ -n "$BUTLER_WEBHOOK_URL" ]; then
            curl -s -X POST "$BUTLER_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"task\":\"revenue_sync\",\"ts\":\"$(date -u)\",\"status\":\"storefront_checked\"}" \
              && echo "[OK] Pulse sent" || echo "[WARN] Pulse failed"
          else
            echo "[WARN] BUTLER_WEBHOOK_URL not set — no pulse"
          fi

      - name: Fail if cash surface is down
        if: steps.cash.outputs.fail == '1'
        run: |
          echo "::error::Required cash surface failed. Job is red on purpose."
          exit 1
