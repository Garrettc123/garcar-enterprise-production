name: Revenue Loop

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  run-revenue:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Storefront is the revenue surface
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://garrettc123.github.io/" || echo "000")
          echo "Storefront HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cannot claim a revenue loop while the $47 page is down"
            exit 1
          fi
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pandas scikit-learn joblib sqlalchemy
      - run: python revenue_loop.py
      - name: Honest status
        run: echo "Loop process ran. No Stripe charge is implied by a green check."
