# GAR-431: Manually approved client deployment with fail-closed release checks
# Deployment requires explicit workflow dispatch; repository pushes cannot deploy.
name: Client Environment Auto-Deploy

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Client name (used for env tagging)'
        required: true
      deploy_target:
        description: 'Deployment provider (Railway only in this workflow)'
        type: choice
        options:
          - railway
        required: true
        default: railway

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q
          python -m compileall -q backend src tests

  health-check:
    permissions:
      contents: read
    name: Pre-deploy Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate env var templates
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=0
          for key in RAILWAY_TOKEN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Required release secrets are configured (values not disclosed)."

  deploy-railway:
    permissions:
      contents: read
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: production
    needs: [test, health-check]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'railway'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check RAILWAY_TOKEN
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service garcar-billing
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CLIENTS_DB_ID: ${{ secrets.NOTION_CLIENTS_DB_ID }}
          NOTION_LEADS_DB_ID: ${{ secrets.NOTION_LEADS_DB_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - name: Report status to Linear
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name }}
        run: |
          echo "Deploy complete for client: $CLIENT_NAME"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  notify:
    permissions: {} 
    name: Notify on Deploy
    runs-on: ubuntu-latest
    needs: [test, health-check, deploy-railway]
    if: needs.test.result == 'success' && needs.health-check.result == 'success' && needs.deploy-railway.result == 'success'
    steps:
      - name: Send deploy notification
        env:
          CLIENT_NAME: ${{ github.event.inputs.client_name }}
          DEPLOY_RESULT: ${{ needs.deploy-railway.result }}
        run: |
          echo "Deploy pipeline complete"
          echo "Client: $CLIENT_NAME"
          echo "Result: $DEPLOY_RESULT"
