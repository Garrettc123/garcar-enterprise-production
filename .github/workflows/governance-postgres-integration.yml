name: Governance PostgreSQL Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/governance/**'
      - 'init_db.py'
      - 'requirements.txt'
      - 'tests/test_governance_postgres.py'
      - '.github/workflows/governance-postgres-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/governance/**'
      - 'init_db.py'
      - 'requirements.txt'
      - 'tests/test_governance_postgres.py'
      - '.github/workflows/governance-postgres-integration.yml'

permissions:
  contents: read

jobs:
  postgres-pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: garcar_ci
          POSTGRES_USER: garcar_ci
          POSTGRES_PASSWORD: garcar_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garcar_ci -d garcar_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://garcar_ci:garcar_ci_password@localhost:5432/garcar_ci
      DB_CONNECT_RETRIES: "10"
      DB_CONNECT_RETRY_DELAY_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests init_db.py
      - name: PostgreSQL and pgvector integration tests
        run: python -m pytest -q tests/test_governance_postgres.py
