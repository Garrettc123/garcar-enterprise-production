name: Autonomous Sales Fleet

on:
  schedule:
    - cron: "5 14 * * 1-5"
  workflow_dispatch:
    inputs:
      sku:
        description: "SKU key (47 | 497 | 2500)"
        required: false
        default: "47"
      limit:
        description: "Max leads this run"
        required: false
        default: "15"
      live:
        description: "Set true to send email (requires RESEND_API_KEY and an approval)"
        required: false
        default: "false"
      approval_id:
        description: "GAR-530: Garrett-issued send.email approval ID (required when live=true)"
        required: false
        default: ""
      approval_record:
        description: "GAR-530: signed record line from `approval_gate.cli grant --print-record` (required when live=true)"
        required: false
        default: ""

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  fleet:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Storefront + payments edge must be up
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://garrettc123.github.io/" || echo "000")
          echo "Storefront HTTP $code"
          pay=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://garcar-payments.garrettc123.workers.dev/health" || echo "000")
          echo "Payments edge HTTP $pay"
          if [ "$code" != "200" ]; then
            echo "::error::Storefront down — abort fleet"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: GAR-530 approval gate (live runs need Garrett's approval)
        if: github.event.inputs.live == 'true'
        env:
          APPROVAL_ID: ${{ github.event.inputs.approval_id }}
          APPROVAL_RECORD: ${{ github.event.inputs.approval_record }}
        run: |
          if [ -z "$APPROVAL_ID" ] || [ -z "$APPROVAL_RECORD" ]; then
            echo "::error::live=true needs approval_id and approval_record (python -m approval_gate.cli grant ... --print-record)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/approvals"
          printf '%s\n' "$APPROVAL_RECORD" > "$RUNNER_TEMP/approvals/approvals.jsonl"

      - name: Run sales fleet
        env:
          FLEET_DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
          GARCAR_DEFAULT_SKU: ${{ github.event.inputs.sku || '47' }}
          FLEET_MAX_LEADS: ${{ github.event.inputs.limit || '15' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FLEET_LEAD_JSON: ${{ secrets.FLEET_LEAD_JSON }}
          GARCAR_PAYMENTS_URL: https://garcar-payments.garrettc123.workers.dev
          PYTHONPATH: .
          FLEET_APPROVAL_ID: ${{ github.event.inputs.approval_id }}
          APPROVALS_PATH: ${{ runner.temp }}/approvals/approvals.jsonl
          APPROVAL_VERIFY_KEY: ${{ secrets.APPROVAL_VERIFY_KEY }}
        run: |
          python -m agents.sales_fleet.fleet \
            --sku "${GARCAR_DEFAULT_SKU}" \
            --limit "${FLEET_MAX_LEADS}" \
            $( [ "$FLEET_DRY_RUN" = "false" ] && echo --live || true )

      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-ledger
          path: |
            agents/sales_fleet/fleet_ledger.json
            ${{ runner.temp }}/approvals/policy_events.jsonl
          if-no-files-found: ignore
