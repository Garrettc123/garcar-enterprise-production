# Customer provisioning is intentionally disabled until a payment-bound,
# authenticated, idempotent provisioning service is implemented and tested.
# This workflow is a manual deployment verification path only.
name: Manual Vercel Deployment Verification
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Operator-approved release reference (no customer data)'
        required: true
        type: string

permissions: {}
concurrency:
  group: manual-vercel-deploy-verification
  cancel-in-progress: false

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require configured deployment credentials and target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
      - name: Create and verify deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST 'https://api.vercel.com/v13/deployments' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg project "$VERCEL_PROJECT_ID" '{name:$project,project:$project,gitSource:{type:"github",ref:"main"}}')")
          deployment_id=$(jq -er '.id | select(type=="string" and length>0)' <<< "$response")
          state=""
          for attempt in $(seq 1 40); do
            response=$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id")
            state=$(jq -r '.readyState // .status // "UNKNOWN"' <<< "$response")
            if [[ "$state" == "READY" ]]; then
              echo 'Vercel deployment reported READY'
              exit 0
            fi
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then
              echo "Vercel deployment failed: $state" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Deployment not ready before timeout; final state: $state" >&2
          exit 1
