version: '3.8'
services:
  garcar-gateway:
    build: .
    container_name: garcar-enterprise-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://127.0.0.1:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-root-token}
      - S3_LEDGER_BUCKET=${S3_LEDGER_BUCKET:-garcar-enterprise-immutable-ledger}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    networks:
      - garcar-net
networks:
  garcar-net:
    driver: bridge
