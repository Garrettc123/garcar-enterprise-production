services:
  garcar-gateway:
    build: .
    container_name: garcar-enterprise-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      VAULT_ADDR: ${VAULT_ADDR:?set VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN:?inject short-lived Vault token}
      VAULT_MOUNT: secret
      VAULT_PATH: garcar/production/keys
      S3_LEDGER_BUCKET: ${S3_LEDGER_BUCKET:?set S3_LEDGER_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set Stripe webhook secret}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
