services:
  garcar-gateway:
    build: .
    image: garcar-enterprise-gateway:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      VAULT_ADDR: ${VAULT_ADDR:?Set VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?Set VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?Set VAULT_SECRET_ID}
      VAULT_KV_PATH: ${VAULT_KV_PATH:-garcar/production/keys}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_LEDGER_BUCKET: ${S3_LEDGER_BUCKET:?Set S3_LEDGER_BUCKET}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
